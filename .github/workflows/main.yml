name: Build Motorbike Car Zone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create APK-only app
        run: |
          rm -rf www android package.json capacitor.config.json

          mkdir -p www
          cp index.html www/index.html

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("www/index.html")
          s = p.read_text()

          # APK ONLY:
          # Change Firestore one-time loading to real-time listening.
          s = s.replace(
              "query, where, getDocs",
              "query, where, onSnapshot"
          )

          # In case the import has a different spacing/order.
          s = s.replace(
              "query,where,getDocs",
              "query,where,onSnapshot"
          )

          # Replace the approved-vehicle loader in the APK copy only.
          pattern = r'async function loadApprovedVehicles\(\)\s*\{.*?\n\}'

          replacement = r'''let approvedVehiclesUnsubscribe = null;

          function loadApprovedVehicles(){
            if(approvedVehiclesUnsubscribe){
              approvedVehiclesUnsubscribe();
              approvedVehiclesUnsubscribe = null;
            }

            const q = query(
              collection(db,"vehicles"),
              where("status","==","approved")
            );

            approvedVehiclesUnsubscribe = onSnapshot(
              q,
              (snap)=>{
                const approved = [];

                snap.forEach(s=>{
                  approved.push(normalizeVehicle(s));
                });

                currentVehicleList = approved;
                render(currentVehicleList);
              },
              (error)=>{
                console.error("Approved vehicle realtime error:",error);
              }
            );
          }'''

          new_s, count = re.subn(
              pattern,
              replacement,
              s,
              count=1,
              flags=re.S
          )

          if count != 1:
              raise SystemExit(
                  "Could not find loadApprovedVehicles() in APK source. Build stopped safely."
              )

          p.write_text(new_s)

          print("APK-only realtime Firestore update enabled.")
          print("Website source was NOT modified.")
          PY

          cat > package.json <<'EOF'
          {
            "name": "motorbike-car-zone",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^8.0.0",
              "@capacitor/cli": "^8.0.0",
              "@capacitor/core": "^8.0.0"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.finnishta.motorbikecarzone",
            "appName": "Motorbike & Car Zone",
            "webDir": "www"
          }
          EOF

          npm install
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Motorbike-Car-Zone-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
