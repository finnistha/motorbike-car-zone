name: Build Motorbike Car Zone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Android project
        run: |
          rm -rf www android package.json capacitor.config.json

          mkdir -p www
          cp index.html www/index.html

          cat > package.json <<'EOF'
          {
            "name": "motorbike-car-zone",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^8.0.0",
              "@capacitor/cli": "^8.0.0",
              "@capacitor/core": "^8.0.0"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.finnishta.motorbikecarzone",
            "appName": "Motorbike & Car Zone",
            "webDir": "www"
          }
          EOF

          npm install
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Motorbike-Car-Zone-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
