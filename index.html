<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3025c8">
<title>MOTORBIKE & CAR ZONE</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 overflow-x:hidden;
 font-family:Arial,sans-serif;
 background:#f5f6fb;
 color:#202124;
}

.hidden{display:none!important}

header{
 background:linear-gradient(135deg,#3025c8,#2878e8);
 color:white;
 padding:22px 14px 25px;
 border-radius:0 0 24px 24px;
}

.logo{
 font-size:clamp(18px,5vw,25px);
 font-weight:900;
}

.search{
 margin-top:20px;
 background:white;
 border-radius:14px;
 padding:7px;
 display:flex;
 gap:7px;
}

.search input{
 flex:1;
 min-width:0;
 border:0;
 outline:0;
 padding:12px;
 font-size:14px;
}

button{
 border:0;
 border-radius:12px;
 padding:12px 15px;
 font-weight:700;
 cursor:pointer;
}

.primary{background:#3025c8;color:white}
.light{background:#eef0ff;color:#4b36a5}

.categoryScroll{
 display:flex;
 gap:15px;
 overflow-x:auto;
 margin-top:24px;
 padding:5px 2px 12px;
 scroll-behavior:smooth;
 scrollbar-width:none;
}

.categoryScroll::-webkit-scrollbar{display:none}

.categoryItem{
 flex:0 0 95px;
 text-align:center;
 color:white;
 cursor:pointer;
}

.categoryIcon{
 width:78px;
 height:78px;
 border-radius:50%;
 background:#ffffff20;
 border:2px solid #ffffff40;
 display:flex;
 align-items:center;
 justify-content:center;
 margin:auto;
 color:white;
}

.categoryItem.active .categoryIcon{
 background:white;
 color:#3025c8;
}

.vehicle-drawing{
 width:43px;
 height:43px;
 fill:none;
 stroke:currentColor;
 stroke-width:3;
 stroke-linecap:round;
 stroke-linejoin:round;
}

.categoryItem p{
 font-size:12px;
 font-weight:bold;
 line-height:1.3;
}

main{
 max-width:700px;
 padding:16px;
 margin:auto;
}

h2{
 font-size:19px;
 margin:15px 0;
}

.card{
 background:white;
 border-radius:17px;
 padding:16px;
 box-shadow:0 3px 14px #00000010;
}

.vehicle{margin-top:13px}

.price{
 font-size:20px;
 font-weight:800;
 margin-top:8px;
}

.spec{
 font-size:13px;
 color:#666;
 margin-top:5px;
}

.muted{
 font-size:13px;
 color:#777;
}

.badge{
 display:inline-block;
 background:#e8f7ee;
 color:#137333;
 padding:5px 9px;
 border-radius:12px;
 font-size:12px;
 font-weight:bold;
}

.mainPhotoGallery{
 display:grid;
 grid-template-columns:2fr 1fr 1fr;
 grid-template-rows:80px 80px;
 gap:6px;
 margin-top:13px;
 height:166px;
}

.mainPhoto{
 grid-row:1/3;
 overflow:hidden;
 border-radius:12px;
}

.mainPhoto img,.smallPhoto img{
 width:100%;
 height:100%;
 object-fit:cover;
 display:block;
}

.smallPhoto{
 overflow:hidden;
 border-radius:10px;
}

.morePhotos{
 display:flex;
 align-items:center;
 justify-content:center;
 background:#333;
 color:white;
 border-radius:10px;
 font-size:22px;
}

.form{
 display:grid;
 gap:10px;
}

.form input,.form select,.form textarea{
 width:100%;
 padding:13px;
 border:1px solid #ddd;
 border-radius:11px;
 font-size:14px;
}

.filebox{
 background:#fafaff;
 border:1px dashed #bbb;
 border-radius:12px;
 padding:12px;
}

.progress{
 font-size:13px;
 color:#3025c8;
 min-height:18px;
}

#detailsModal{
 position:fixed;
 inset:0;
 z-index:99998;
 background:#0009;
 display:none;
 align-items:flex-end;
 justify-content:center;
}

#detailsCard{
 width:100%;
 max-width:700px;
 max-height:88vh;
 overflow:auto;
 background:white;
 border-radius:24px 24px 0 0;
 padding:20px;
}

.detailRow{
 padding:11px 0;
 border-bottom:1px solid #eee;
 font-size:14px;
}

.detailLabel{font-size:12px;color:#777}
.detailValue{font-weight:bold;margin-top:3px}

.mediaGrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
 margin-top:10px;
}

.mediaGrid img{
 width:100%;
 height:150px;
 object-fit:cover;
 border-radius:10px;
}

.whatsapp-float{
 position:fixed;
 right:17px;
 bottom:22px;
 z-index:99990;
 width:58px;
 height:58px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#25D366;
 color:white;
 box-shadow:0 4px 14px #0004;
 text-decoration:none;
}

.whatsapp-float svg{
 width:33px;
 height:33px;
 fill:white;
}

@media(min-width:700px){
 #detailsModal{align-items:center;padding:20px}
 #detailsCard{border-radius:24px}
}

@media(max-width:420px){
 .categoryItem{flex-basis:88px}
 .categoryIcon{width:72px;height:72px}
 .vehicle-drawing{width:39px;height:39px}
 .mainPhotoGallery{
  height:145px;
  grid-template-rows:69px 69px;
 }
}
</style>
</head>

<body>

<!-- WHATSAPP BUTTON -->

<a class="whatsapp-float"

 rel="noopener"

<!-- DETAILS MODAL -->

<div id="detailsModal" onclick="if(event.target===this)closeDetails()">

 <div id="detailsCard">

  <div style="display:flex;justify-content:space-between;align-items:center">
   <h2 id="detailsTitle">Vehicle Details</h2>
   <button class="light" onclick="closeDetails()">Close</button>
  </div>

  <div id="detailsBody"></div>

  <button id="detailsWhatsApp" class="primary"
   style="width:100%;margin-top:15px">
   Contact Motorbike & Car Zone
  </button>

 </div>
</div>

<!-- HEADER -->

<header>

 <div class="logo">MOTORBIKE &amp; CAR ZONE</div>

 <div class="search">
  <input id="searchInput"
   type="search"
   placeholder="Search cars, bikes, brand or model">

  <button class="primary" onclick="runSearch()">Search</button>
 </div>

 <!-- TOP MENU -->

 <div class="categoryScroll">

  <div class="categoryItem active"
   onclick="selectCategory('all',this)">

   <div class="categoryIcon">
    <svg class="vehicle-drawing" viewBox="0 0 64 64">
     <rect x="10" y="10" width="18" height="18" rx="2"/>
     <rect x="36" y="10" width="18" height="18" rx="2"/>
     <rect x="10" y="36" width="18" height="18" rx="2"/>
     <circle cx="45" cy="45" r="9"/>
    </svg>
   </div>

   <p>All</p>
  </div>

  <div class="categoryItem"
   onclick="selectCategory('car',this)">

   <div class="categoryIcon">
    <svg class="vehicle-drawing" viewBox="0 0 64 64">
     <path d="M10 37l4-13c1-3 3-5 7-5h22c4 0 6 2 7 5l4 13 3 4v11h-6v-6H13v6H7V41l3-4z"/>
     <path d="M17 34h30l-3-10H20l-3 10z"/>
     <circle cx="18" cy="42" r="4"/>
     <circle cx="46" cy="42" r="4"/>
    </svg>
   </div>

   <p>Buy Used Car</p>
  </div>

  <div class="categoryItem"
   onclick="selectCategory('bike',this)">

   <div class="categoryIcon">
    <svg class="vehicle-drawing" viewBox="0 0 64 64">
     <circle cx="15" cy="44" r="9"/>
     <circle cx="49" cy="44" r="9"/>
     <path d="M15 44l11-18h11l12 18H31l-5-18m11 0h8l5 18"/>
     <path d="M29 26l-5-5h-7m20 5l5-5h6"/>
    </svg>
   </div>

   <p>Buy Used Bike</p>
  </div>

  <div class="categoryItem"
   onclick="show('seller')">

   <div class="categoryIcon">
    <svg class="vehicle-drawing" viewBox="0 0 64 64">
     <circle cx="23" cy="25" r="13"/>
     <circle cx="23" cy="25" r="5"/>
     <path d="M33 34l20 20 5-5-5-5 4-4-7-7-4 4-7-7"/>
    </svg>
   </div>

   <p>Sell Vehicle</p>
  </div>

 </div>
</header>

<main id="appContent">

<!-- HOME -->

<section id="home">

 <h2>Approved Vehicles</h2>

 <div id="vehicles">
  <div class="card muted">Connecting to database...</div>
 </div>

</section>

<!-- SELL VEHICLE -->

<section id="seller" class="hidden">

 <h2>Sell Your Vehicle</h2>

 <div class="card">

  <p
