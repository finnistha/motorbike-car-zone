<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3025c8">
<title>MOTORBIKE & CAR ZONE</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden}
body{font-family:Arial,sans-serif;background:#f5f6fb;color:#202124}

header{
 background:#3025c8;
 color:white;
 padding:22px 14px 28px;
 border-radius:0 0 25px 25px;
 width:100%;
}

.logo{
 font-size:clamp(18px,5vw,25px);
 font-weight:900;
 line-height:1.3;
}

.search{
 margin-top:22px;
 background:white;
 border-radius:15px;
 padding:7px;
 display:flex;
 gap:7px;
 width:100%;
}

.search input{
 flex:1;
 min-width:0;
 border:0;
 outline:0;
 font-size:14px;
 padding:12px 8px;
}

button{
 border:0;
 border-radius:12px;
 padding:12px 15px;
 font-weight:700;
 cursor:pointer;
}

.primary{background:#3025c8;color:white}
.light{background:#eef0ff;color:#4b36a5}

.categoryScroll{
 display:flex;
 gap:15px;
 overflow-x:auto;
 margin-top:25px;
 padding:5px 2px 12px;
 scroll-behavior:smooth;
 scrollbar-width:none;
 overscroll-behavior-x:contain;
}

.categoryScroll::-webkit-scrollbar{display:none}

.categoryItem{
 flex:0 0 100px;
 text-align:center;
 color:white;
 cursor:pointer;
}

.categoryIcon{
 width:82px;
 height:82px;
 border-radius:50%;
 background:rgba(255,255,255,.12);
 border:2px solid rgba(255,255,255,.2);
 display:flex;
 align-items:center;
 justify-content:center;
 margin:auto;
 color:white;
}

.categoryItem.active .categoryIcon{
 background:white;
 color:#3025c8;
}

.vehicle-drawing{
 width:45px;
 height:45px;
 fill:none;
 stroke:currentColor;
 stroke-width:3;
 stroke-linecap:round;
 stroke-linejoin:round;
}

.categoryItem p{
 font-size:12px;
 font-weight:700;
 line-height:1.3;
 white-space:normal;
}

main{
 width:100%;
 max-width:700px;
 padding:16px;
 margin:auto;
}

h2{font-size:19px;margin:15px 0}

.card{
 background:white;
 border-radius:17px;
 padding:16px;
 box-shadow:0 3px 14px #00000010;
}

.vehicle{margin-top:13px}
.price{font-size:20px;font-weight:800;margin-top:8px}
.spec{font-size:13px;color:#666;margin-top:5px}
.muted{font-size:13px;color:#777;margin-top:5px}

.badge{
 display:inline-block;
 background:#e8f7ee;
 color:#137333;
 padding:5px 9px;
 border-radius:12px;
 font-size:12px;
 font-weight:700;
}

.mainPhotoGallery{
 display:grid;
 grid-template-columns:2fr 1fr 1fr;
 grid-template-rows:80px 80px;
 gap:6px;
 margin-top:13px;
 height:166px;
}

.mainPhoto{
 grid-row:1/3;
 overflow:hidden;
 border-radius:12px;
 background:#eef0ff;
}

.mainPhoto img,.smallPhoto img{
 width:100%;
 height:100%;
 object-fit:cover;
 display:block;
}

.smallPhoto{
 overflow:hidden;
 border-radius:10px;
}

.morePhotos{
 display:flex;
 align-items:center;
 justify-content:center;
 background:#333;
 color:white;
 border-radius:10px;
 font-size:22px;
}

#detailsModal{
 position:fixed;
 inset:0;
 z-index:99998;
 background:#0009;
 display:none;
 align-items:flex-end;
 justify-content:center;
}

#detailsCard{
 width:100%;
 max-width:700px;
 max-height:88vh;
 overflow:auto;
 background:white;
 border-radius:24px 24px 0 0;
 padding:20px;
}

.detailRow{
 padding:11px 0;
 border-bottom:1px solid #eee;
 font-size:14px;
}

.detailLabel{font-size:12px;color:#777}
.detailValue{font-weight:700;margin-top:3px;white-space:pre-wrap}

.mediaGrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
 margin-top:10px;
}

.mediaGrid img{
 width:100%;
 height:150px;
 object-fit:cover;
 border-radius:10px;
}

.form{display:grid;gap:10px}

.form input,.form select,.form textarea{
 width:100%;
 padding:13px;
 border:1px solid #ddd;
 border-radius:11px;
 font-size:14px;
}

.filebox{
 background:#fafaff;
 border:1px dashed #bbb;
 border-radius:12px;
 padding:12px;
}

.progress{
 font-size:13px;
 color:#3025c8;
 min-height:18px;
}

.whatsapp-float{
 position:fixed;
 right:17px;
 bottom:22px;
 z-index:99990;
 width:58px;
 height:58px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#25D366;
 color:white;
 box-shadow:0 4px 14px #0004;
 text-decoration:none;
}

.whatsapp-float svg{width:33px;height:33px;fill:white}

@media(min-width:700px){
 #detailsModal{align-items:center;padding:20px}
 #detailsCard{border-radius:24px}
}

@media(max-width:420px){
 .categoryItem{flex-basis:90px}
 .categoryIcon{width:75px;height:75px}
 .vehicle-drawing{width:40px;height:40px}
 .mainPhotoGallery{
  height:145px;
  grid-template-rows:69px 69px;
 }
}
</style>
</head>

<body>

<a class="whatsapp-float"

</svg>
</a>

<!-- VEHICLE DETAILS MODAL -->
<div id="detailsModal" onclick="if(event.target===this)closeDetails()">
 <div id="detailsCard">

  <div style="display:flex;justify-content:space-between;align-items:center">
   <h2 id="detailsTitle">Vehicle Details</h2>
   <button class="light" onclick="closeDetails()">Close</button>
  </div>

  <div id="detailsBody"></div>

  <button id="detailsWhatsApp" class="primary"
   style="width:100%;margin-top:15px">
   Contact Motorbike & Car Zone
  </button>

 </div>
</div>

<!-- WEBSITE HEADER -->
<header>

 <div class="logo">MOTORBIKE &amp; CAR ZONE</div>

 <div class="search">
  <input id="searchInput"
   type="search"
   placeholder="Search Alto, Swift, Honda...">

  <button class="primary" onclick="runSearch()">Search</button>
 </div>

 <!-- CATEGORY DRAWINGS -->
 <div class="categoryScroll">

  <div class="categoryItem active"
   onclick="selectCategory('all',this)">
   <div class="categoryIcon">
    <svg class="vehicle-drawing" viewBox="0 0 64 64">
     <rect x="10" y="10" width="18" height="18" rx="2"/>
     <rect x="36" y="10" width="18" height="18" rx="2"/>

   onclick="selectCategory('car',this)">

   </div>
   <p>Sell Vehicle</p>
  </div>

 </div>
</header>

<main id="appContent">

<!-- APPROVED VEHICLES -->
<section id="home">

 <h2>Approved Vehicles</h2>

 <div id="vehicles">
  <div class="card muted">Connecting to vehicle database...</div>
 </div>

   <textarea id="notes" rows="3"

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
 getAuth,
 signInAnonymously,
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
 getFirestore,
 collection,
 addDoc,
 serverTimestamp,
 query,
 where,
 onSnapshot
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* FIREBASE CONFIGURATION */

const firebaseConfig = {
 apiKey: "AIzaSyDHQmPbIsNneQi0Ra553e9F6GXqvfjxMhU",
 authDomain: "motorbike--car-zone.firebaseapp.com",
 projectId: "motorbike--car-zone",
 storageBucket: "motorbike--car-zone.firebasestorage.app",
 messagingSenderId: "604944422467",
 appId: "1:604944422467:web:57f36ceb7b3f60326b26f6",
 measurementId: "G-F9BFX3GFTB"
};


/* CLOUDINARY CONFIGURATION */

const CLOUD_NAME = "forby6hp";
const UPLOAD_PRESET = "motorbike_car_zone";

const CLOUDINARY_UPLOAD_URL =
 `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;


/* INITIALIZE FIREBASE */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let currentVehicleList = [];
let displayedVehicleList = [];
let approvedVehiclesUnsubscribe = null;
let activeFilter = "all";


/* HTML SECURITY */

function escapeHtml(value) {
 return String(value ?? "").replace(/[&<>"']/g, ch => ({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[ch]));
}


/* SHOW SECTION */

window.show = function(id) {

 ["home","seller"].forEach(section => {
  document.getElementById(section).classList.add("hidden");
 });

 document.getElementById(id).classList.remove("hidden");

 window.scrollTo(0,0);
};


/* FIREBASE AUTHENTICATION */

let approvedLoadStarted = false;

onAuthStateChanged(auth, async user => {

 currentUser = user || null;

 if(user) {

  if(!approvedLoadStarted) {
   approvedLoadStarted = true;
   loadApprovedVehicles();
  }

 } else {

  try {

   await signInAnonymously(auth);

  } catch(error) {

   console.error("Firebase authentication error:",error);

   document.getElementById("vehicles").innerHTML =
    '<div class="card muted">Firebase connection error: ' +
    escapeHtml(error.code || error.message) +
    '. Check Anonymous Authentication settings.</div>';

  }

 }

});


/* NORMALIZE VEHICLE DATA */

function normalizeVehicle(docSnap) {

 const d = docSnap.data();

 const rawType = String(d.type || "car").trim().toLowerCase();

 const type = [
  "bike","bikes","motorbike","motorcycle"
 ].includes(rawType) ? "bike" : "car";

 const photoCandidates = [
  ...(Array.isArray(d.photoUrls) ? d.photoUrls : []),
  ...(Array.isArray(d.photos) ? d.photos : []),
  ...(Array.isArray(d.vehiclePhotos) ? d.vehiclePhotos : []),
  ...(Array.isArray(d.imageUrls) ? d.imageUrls : [])
 ];

 const photoUrls = [...new Set(photoCandidates.map(x => {

  if(typeof x === "string") return x;

  if(x && typeof x === "object") {
   return x.url || x.secure_url || x.downloadURL || x.src || "";
  }

  return "";

 }).filter(Boolean))];

 return {
  id:docSnap.id,
  type:type,
  name:d.model || d.brand || "Vehicle",
  year:d.year || "",
  km:d.km || "",
  loc:d.location || d.loc || "",
  price:d.amount || d.price || "",
  colour:d.colour || "",
  notes:d.notes || "",
  photoUrls:photoUrls
 };

}


/* LOAD ONLY APPROVED VEHICLES */

function loadApprovedVehicles() {

 if(approvedVehiclesUnsubscribe) {
  approvedVehiclesUnsubscribe();
 }

 const vehiclesQuery = query(
  collection(db,"vehicles"),
  where("status","==","approved")
 );

 approvedVehiclesUnsubscribe = onSnapshot(
  vehiclesQuery,

  snap => {

   currentVehicleList = [];

   snap.forEach(docSnap => {
    currentVehicleList.push(normalizeVehicle(docSnap));
   });

   applyCurrentFilter();

  },

  error => {

   console.error("Firestore error:",error);

   document.getElementById("vehicles").innerHTML =
    '<div class="card muted">Unable to load vehicles. Firebase error: ' +
    escapeHtml(error.code || error.message) +
    '. Check Firestore security rules and status field.</div>';

  }

 );

}


/* FILTER APPROVED VEHICLES */

function applyCurrentFilter() {

 const filtered = activeFilter === "all"
  ? currentVehicleList.slice()
  : currentVehicleList.filter(v => v.type === activeFilter);

 render(filtered);

}


/* DISPLAY VEHICLES */

window.render = function(list = currentVehicleList) {

 displayedVehicleList = list.slice();

 const box = document.getElementById("vehicles");

 if(!list.length) {

  box.innerHTML =
   '<div class="card muted">No approved vehicles found.</div>';

  return;

 }

 box.innerHTML = list.map((v,i) => {

  const photos = Array.isArray(v.photoUrls)
   ? v.photoUrls.filter(Boolean)
   : [];

  const photoHtml = photos.length ? `
   <div class="mainPhotoGallery">

    <div class="mainPhoto">
     <img src="${escapeHtml(photos[0])}"
      alt="Vehicle photo" loading="lazy">
    </div>

    ${photos.slice(1,4).map(url => `
     <div class="smallPhoto">
      <img src="${escapeHtml(url)}"
       alt="Vehicle photo" loading="lazy">
     </div>
    `).join("")}

    ${photos.length > 4
     ? `<div class="morePhotos">+${photos.length-4}</div>`
     : ""}

   </div>
  ` : "";

  return `
   <div class="card vehicle">

    <span class="badge">APPROVED</span>

    ${photoHtml}

    <h3>${escapeHtml(v.name)}</h3>

    <div class="spec">
     ${escapeHtml(v.year)} •
     ${escapeHtml(v.km)} KM •
     ${escapeHtml(v.colour)}
    </div>

    <div class="spec">
     Location: ${escapeHtml(v.loc)}
    </div>

    <div class="price">
     ₹${escapeHtml(v.price)}
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">

     <button class="light" onclick="viewDetails(${i})">
      View Details
     </button>

     <button class="primary" onclick="contactByIndex(${i})">
      WhatsApp Enquiry
     </button>

    </div>

   </div>
  `;

 }).join("");

};


/* CATEGORY FILTER */

window.selectCategory = function(type,element) {

 activeFilter = type;

 document.querySelectorAll(".categoryItem").forEach(item => {
  item.classList.remove("active");
 });

 if(element) {
  element.classList.add("active");
 }

 show("home");

 applyCurrentFilter();

};


/* SEARCH */

window.runSearch = function() {

 const term = (
  document.getElementById("searchInput").value || ""
 ).trim().toLowerCase();

 const base = activeFilter === "all"
  ? currentVehicleList
  : currentVehicleList.filter(v => v.type === activeFilter);

 if(!term) {
  render(base);
  return;
 }

 const results = base.filter(v => [

  v.type,
  v.name,
  v.year,
  v.km,
  v.loc,
  v.price,
  v.colour

 ].some(value =>
  String(value ?? "").toLowerCase().includes(term)
 ));

 render(results);

};


document.getElementById("searchInput").addEventListener(
 "keydown",
 event => {
  if(event.key === "Enter") runSearch();
 }
);


/* AUTOMATIC CATEGORY SLIDING */

const categoryStrip = document.querySelector(".categoryScroll");

let categoryPauseUntil = 0;

if(categoryStrip) {

 setInterval(() => {

  if(Date.now() < categoryPauseUntil) return;

  const maxScroll =
   categoryStrip.scrollWidth - categoryStrip.clientWidth;

  if(maxScroll <= 2) return;

  const step = Math.max(
   100,
   Math.round(categoryStrip.clientWidth * 0.55)
  );

  if(categoryStrip.scrollLeft + step >= maxScroll - 5) {

   categoryStrip.scrollTo({
    left:0,
    behavior:"smooth"
   });

  } else {

   categoryStrip.scrollBy({
    left:step,
    behavior:"smooth"
   });

  }

 },2000);

 ["touchstart","pointerdown","wheel"].forEach(eventName => {

  categoryStrip.addEventListener(eventName,() => {
   categoryPauseUntil = Date.now() + 5000;
  },{passive:true});

 });

}


/* WHATSAPP CONTACT */

function contact(model,price) {

 const number = "918722892965";

 const message =
  "Hello MOTORBIKE & CAR ZONE, I am interested in " +
  model +
  " listed at ₹" +
  price +
  ". Please help me with this vehicle.";

 window.open(
  "https://wa.me/" + number +
  "?text=" + encodeURIComponent(message),
  "_blank",
  "noopener"
 );

}


window.contactByIndex = function(index) {

 const vehicle = displayedVehicleList[index];

 if(vehicle) {
  contact(vehicle.name,vehicle.price);
 }

};


/* VEHICLE DETAILS */

window.viewDetails = function(index) {

 const v = displayedVehicleList[index];

 if(!v) return;

 document.getElementById("detailsTitle").textContent = v.name;

 const row = (label,value) => `
  <div class="detailRow">
   <div class="detailLabel">${escapeHtml(label)}</div>
   <div class="detailValue">${escapeHtml(value)}</div>
  </div>
 `;

 let html = "";

 html += row("Vehicle Type",v.type === "car" ? "Car" : "Bike");
 html += row("Brand / Model",v.name);
 html += row("Year",v.year);
 html += row("KM Driven",v.km);
 html += row("Colour",v.colour);
 html += row("Location",v.loc);
 html += row("Selling Price","₹" + v.price);

 if(v.notes) {
  html += row("Vehicle Details",v.notes);
 }

 if(v.photoUrls?.length) {

  html += `
   <div class="detailRow">
    <div class="detailLabel">Vehicle Photos</div>

    <div class="mediaGrid">

     ${v.photoUrls.map(url => `
      <a href="${escapeHtml(url)}"
       target="_blank" rel="noopener">
       <img src="${escapeHtml(url)}"
        alt="Vehicle photo">
      </a>
     `).join("")}

    </div>
   </div>
  `;

 }

 document.getElementById("detailsBody").innerHTML = html;

 document.getElementById("detailsWhatsApp").onclick = () => {
  contact(v.name,v.price);
 };

 document.getElementById("detailsModal").style.display = "flex";

};


window.closeDetails = function() {
 document.getElementById("detailsModal").style.display = "none";
};


/* CLOUDINARY PHOTO UPLOAD */

async function uploadVehiclePhoto(file) {

 const formData = new FormData();

 formData.append("file",file);
 formData.append("upload_preset",UPLOAD_PRESET);

 const response = await fetch(
  CLOUDINARY_UPLOAD_URL,
  {
   method:"POST",
   body:formData
  }
 );

 const data = await response.json();

 if(!response.ok || !data.secure_url) {
  throw new Error(data.error?.message || "Photo upload failed");
 }

 return data.secure_url;

}


/* SUBMIT VEHICLE */

window.submitVehicle = async function() {

 const requiredIds = [
  "name",
  "phone",
  "model",
  "year",
  "km",
  "amount",
  "location"
 ];

 const status = document.getElementById("status");
 const progress = document.getElementById("sellerProgress");
 const button = document.getElementById("submitVehicleBtn");

 if(requiredIds.some(id =>
  !document.getElementById(id).value.trim()
 )) {

  status.textContent =
   "Please fill Name, Mobile, Model, Year, KM, Amount and Location.";

  return;

 }

 const phone = document.getElementById("phone").value.trim();

 if(!/^[0-
